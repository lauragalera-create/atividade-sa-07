<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
</head>
<body>
    <header>
        <h1>Agendamento</h1>
        <nav>
            <a href="index.html">Início</a><br>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>
    <main>
        <h2>Agende sua consulta</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome"><br>
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email"><br>
            <label for="telefone">Telefone:</label>
            <input 
                name="telefone"
                id="telefone"
                required
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DDD. Exemplo: (17)98765-4321 ou 17987654321"
            ><br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data"><br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora"><br>
            <label for="especialidade">Especialidades:</label>
            <select name="especialidade" id="especialidade">
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>
    </main>

    <footer>
        <p>
            &copy;Clínica Vida Plena - Todos os direitos reservador
        </p>
    </footer>
</body>
</html>
